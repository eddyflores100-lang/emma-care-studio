name: Emma Care Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: emma-care-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exact lockfile dependencies
        run: bun install --frozen-lockfile
      - name: Run browser-game regression tests
        run: bun run test
      - name: TypeScript check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build static browser release
        run: bun run build:export
      - name: Verify static entrypoint
        run: test -s out/index.html
