# Despliega Emma Care Studio a GitHub Pages (emmacare.alicelabs.site)
# - Se ejecuta en cada push a main
# - Compila la versión estática (EXPORT_MODE=1) y la publica
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar versión estática
        run: bun run build:export
        env:
          EXPORT_MODE: "1"
          # mientras el sitio se abra desde el preview github.io/emma-care-studio
          # hace falta basePath. Cuando actives el dominio emmacare.alicelabs.site
          # (Settings → Pages → Custom domain) puedes borrar la línea de abajo
          # y el juego se servirá desde la raíz.
          PAGES_BASE_PATH: "/emma-care-studio"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
