# Despliega Emma Care Studio a GitHub Pages (emmacare.alicelabs.site)
# - Se ejecuta en cada push a main
# - Compila la versión estática (EXPORT_MODE=1) y la publica
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar versión estática
        run: bun run build:export
        env:
          EXPORT_MODE: "1"
          # basePath para github.io/emma-care-studio (el paso de abajo duplica el
          # export también a la raíz, así el dominio emmacare.alicelabs.site
          # funciona sin tocar nada aquí)
          PAGES_BASE_PATH: "/emma-care-studio"

      # El export usa basePath /emma-care-studio. Copiándolo TAMBIÉN dentro de
      # out/emma-care-studio/ el mismo artefacto sirve bien en los dos sitios:
      #  · https://emmacare.alicelabs.site/            (raíz → usa la copia interna)
      #  · https://eddyflores100-lang.github.io/emma-care-studio/  (subruta)
      # Así nunca hay que andar borrando/poniendo el basePath a mano.
      - name: Duplicar export para servir en raíz y en subruta
        run: |
          mkdir -p /tmp/export-dup
          cp -r out/. /tmp/export-dup/
          mkdir -p out/emma-care-studio
          cp -r /tmp/export-dup/. out/emma-care-studio/
          echo "Artefacto listo: raíz + /emma-care-studio"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
